<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liham Pahintulot Online - Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root {
      --pandayan-burgundy: #800020;
      --pandayan-yellow: #FFD700;
      --pandayan-blue: #0000FF;
    }

    body {
      background: linear-gradient(135deg, #800020 0%, #4a0013 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }

    .login-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
      border: 3px solid var(--pandayan-yellow);
    }

    .card-header-pandayan {
      background-color: var(--pandayan-burgundy);
      color: #ffffff;
      padding: 25px 20px;
      text-align: center;
      border-bottom: 4px solid var(--pandayan-yellow);
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--pandayan-yellow);
      margin: 0;
    }

    .brand-sub {
      font-size: 0.85rem;
      opacity: 0.9;
      margin-top: 5px;
    }

    .btn-pandayan {
      background-color: var(--pandayan-burgundy);
      color: #ffffff;
      font-weight: bold;
      border: none;
      padding: 12px;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .btn-pandayan:hover {
      background-color: #600018;
      color: var(--pandayan-yellow);
    }

    .form-control:focus, .form-select:focus {
      border-color: var(--pandayan-burgundy);
      box-shadow: 0 0 0 0.25rem rgba(128, 0, 32, 0.25);
    }

    #loadingOverlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(128, 0, 32, 0.9);
      z-index: 9999;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
    }
  </style>
</head>
<body>

  <div id="loadingOverlay">
    <div class="spinner-border text-warning mb-3" style="width: 3.5rem; height: 3.5rem;" role="status"></div>
    <h5 class="fw-bold text-warning mb-1">Sinusuri ang account...</h5>
    <small class="text-white">Mangyaring maghintay nang ilang sandali.</small>
  </div>

  <div class="login-card">
    <div class="card-header-pandayan">
      <h1 class="brand-title">PANDAYAN SUPERSTORES</h1>
      <div class="brand-sub"><i class="fa-solid fa-file-signature me-1"></i> Liham Pahintulot Online System</div>
    </div>

    <div class="card-body p-4">
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label small fw-bold" style="color: var(--pandayan-burgundy);">USERNAME</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-secondary"><i class="fa-solid fa-user"></i></span>
            <input type="text" id="username" class="form-control" placeholder="I-type ang username..." required>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-bold" style="color: var(--pandayan-burgundy);">PASSWORD</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-secondary"><i class="fa-solid fa-lock"></i></span>
            <input type="password" id="password" class="form-control" placeholder="I-type ang password..." required>
          </div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="rememberMe">
          <label class="form-check-label small text-secondary" for="rememberMe">
            Panatilihing naka-login sa browser na ito
          </label>
        </div>

        <button type="submit" class="btn btn-pandayan w-100 mb-3 shadow-sm">
          <i class="fa-solid fa-right-to-bracket me-2"></i> MAG-LOGIN
        </button>
      </form>

      <div class="text-center pt-2 border-top">
        <small class="text-muted me-1">Wala pang account?</small>
        <button class="btn btn-link p-0 text-decoration-none fw-bold small" style="color: var(--pandayan-burgundy);" data-bs-toggle="modal" data-bs-target="#registerModal">
          Mag-register Dito
        </button>
      </div>
    </div>
  </div>

  <div class="modal fade" id="registerModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius: 16px; overflow: hidden; border: 3px solid var(--pandayan-burgundy);">
        <div class="modal-header card-header-pandayan">
          <h5 class="modal-title fw-bold text-white"><i class="fa-solid fa-user-plus me-2"></i> Bagong Registration</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form id="registerForm">
          <div class="modal-body p-4 bg-light">
            
            <div class="mb-3">
              <label class="form-label small fw-bold" style="color: var(--pandayan-burgundy);">Pangalan ng Kapwa (Full Name)</label>
              <input type="text" id="regKapwaName" class="form-control form-control-sm" placeholder="hal. Juan Dela Cruz" required>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold" style="color: var(--pandayan-burgundy);">Store / Official Email Address</label>
              <input type="email" id="regEmail" class="form-control form-control-sm" placeholder="hal. store.valenzuela@pandayan.com.ph" required>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold" style="color: var(--pandayan-burgundy);">Nais na Username</label>
              <input type="text" id="regUsername" class="form-control form-control-sm" placeholder="hal. juandc" required>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold" style="color: var(--pandayan-burgundy);">Password</label>
              <input type="password" id="regPassword" class="form-control form-control-sm" placeholder="Lumikha ng password..." required>
            </div>

            <div class="alert alert-info p-2 mb-0 border-0 small text-dark" style="background-color: #e2f0d9;">
              <i class="fa-solid fa-circle-info text-success me-1"></i> 
              <b>Paalala:</b> Pagkatapos mag-register, ire-review ng Admin ang iyong account para sa kaukulang Role at Branch Access.
            </div>

          </div>
          <div class="modal-footer bg-white d-flex justify-content-between">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Isara</button>
            <button type="submit" class="btn btn-pandayan btn-sm px-4">MAG-REGISTER</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // PINAKABAGONG DEPLOYED API URL
    const API_URL = "https://script.google.com/macros/s/AKfycbwCb7XQxfkflHsD85M3fpn3tE0v8wRkcMmL4etZoxQzArMrHttNpdvZVi4T-OD3SFHB/exec";

    function showSpinner() { document.getElementById("loadingOverlay").style.display = "flex"; }
    function hideSpinner() { document.getElementById("loadingOverlay").style.display = "none"; }

    // AUTO-REDIRECT IF ALREADY LOGGED IN
    window.onload = function() {
      const session = localStorage.getItem("pandayan_user_session") || sessionStorage.getItem("pandayan_user_session");
      if (session) {
        window.location.href = "dashboard.html";
      }
    };

    // LOGIN FORM SUBMISSION
    document.getElementById("loginForm").onsubmit = function(e) {
      e.preventDefault();
      showSpinner();

      const u = document.getElementById("username").value.trim();
      const p = document.getElementById("password").value.trim();
      const remember = document.getElementById("rememberMe").checked;

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "login",
          payload: { username: u, password: p }
        })
      })
      .then(r => r.json())
      .then(res => {
        hideSpinner();
        if (res.status === "success") {
          const sessionData = JSON.stringify(res.user);
          if (remember) {
            localStorage.setItem("pandayan_user_session", sessionData);
          } else {
            sessionStorage.setItem("pandayan_user_session", sessionData);
          }

          Swal.fire({
            title: "Mabuhay!",
            text: `Maligayang pagbabalik, ${res.user.kapwaName}!`,
            icon: "success",
            timer: 1500,
            showConfirmButton: false
          }).then(() => {
            window.location.href = "dashboard.html";
          });
        } else {
          Swal.fire("Login Failed", res.message, "error");
        }
      })
      .catch(err => {
        hideSpinner();
        Swal.fire("Connection Error", "Hindi makakonekta sa server. Mangyaring subukang muli.", "error");
      });
    };

    // REGISTRATION FORM SUBMISSION
    document.getElementById("registerForm").onsubmit = function(e) {
      e.preventDefault();
      showSpinner();

      const payload = {
        kapwaName: document.getElementById("regKapwaName").value.trim(),
        email: document.getElementById("regEmail").value.trim(),
        username: document.getElementById("regUsername").value.trim(),
        password: document.getElementById("regPassword").value.trim()
      };

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "register",
          payload: payload
        })
      })
      .then(r => r.json())
      .then(res => {
        hideSpinner();
        if (res.status === "success") {
          bootstrap.Modal.getInstance(document.getElementById("registerModal")).hide();
          document.getElementById("registerForm").reset();
          Swal.fire("Mabuhay!", res.message, "success");
        } else {
          Swal.fire("Registration Error", res.message, "error");
        }
      })
      .catch(err => {
        hideSpinner();
        Swal.fire("Connection Error", "Hindi makakonekta sa server. Mangyaring subukang muli.", "error");
      });
    };
  </script>
</body>
</html>
