<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liham Pahintulot - Login & Registration</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root {
      --pandayan-burgundy: #800020;
      --pandayan-yellow: #FFD700;
    }
    body {
      background: linear-gradient(135deg, #800020 0%, #4a0012 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
    }
    .auth-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
      border: 3px solid var(--pandayan-yellow);
    }
    .auth-header {
      background-color: var(--pandayan-burgundy);
      color: white;
      padding: 25px 20px;
      text-align: center;
      border-bottom: 4px solid var(--pandayan-yellow);
    }
    .auth-header h4 {
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--pandayan-yellow);
      margin-bottom: 2px;
    }
    .auth-header p {
      font-size: 0.82rem;
      margin: 0;
      opacity: 0.9;
    }
    .auth-body {
      padding: 25px 25px 20px 25px;
    }
    .form-control {
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.9rem;
    }
    .input-group-text {
      cursor: pointer;
    }
    .btn-pandayan {
      background-color: var(--pandayan-burgundy);
      color: white;
      font-weight: 800;
      border-radius: 8px;
      padding: 10px;
      width: 100%;
      border: none;
      transition: all 0.3s ease;
    }
    .btn-pandayan:hover {
      background-color: #5c0017;
      color: var(--pandayan-yellow);
    }
    .toggle-link {
      color: var(--pandayan-burgundy);
      font-weight: bold;
      cursor: pointer;
      text-decoration: underline;
    }
    .toggle-link:hover {
      color: #5c0017;
    }
    #loadingOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(128, 0, 32, 0.9); z-index: 9999;
      display: none; flex-direction: column; justify-content: center; align-items: center; color: white;
    }
  </style>
</head>
<body>

  <div id="loadingOverlay">
    <div class="spinner-border text-warning mb-3" style="width: 3.5rem; height: 3.5rem;" role="status"></div>
    <h5 class="fw-bold text-warning mb-1" id="loadingText">Kumokonekta sa Server...</h5>
    <small class="text-white">Mangyaring maghintay nang ilang sandali.</small>
  </div>

  <div class="auth-card">
    <div class="auth-header">
      <h4>PANDAYAN</h4>
      <p>Liham Pahintulot Online System</p>
    </div>

    <div class="auth-body">
      
      <!-- LOGIN FORM -->
      <form id="loginForm">
        <h5 class="fw-bold mb-3 text-center" style="color: var(--pandayan-burgundy);">Mag-Log In</h5>
        
        <div class="mb-3">
          <label class="form-label small fw-bold">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="fa-solid fa-user text-secondary"></i></span>
            <input type="text" id="loginUsername" class="form-control" placeholder="Isulat ang username" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-secondary"></i></span>
            <input type="password" id="loginPassword" class="form-control" placeholder="Isulat ang password" required>
            <span class="input-group-text bg-light" onclick="togglePasswordVisibility('loginPassword', 'eyeIconLogin')" title="Ipakita/Itago ang Password">
              <i class="fa-solid fa-eye text-secondary" id="eyeIconLogin"></i>
            </span>
          </div>
        </div>

        <!-- STAY LOGGED IN CHECKBOX -->
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="rememberMe" checked>
          <label class="form-check-label small fw-bold text-secondary" for="rememberMe">
            Manatiling Naka-login (Stay Logged In)
          </label>
        </div>

        <button type="submit" class="btn btn-pandayan mt-1 shadow-sm">LOG IN</button>

        <div class="text-center mt-3 small">
          Wala pang account? <span class="toggle-link" onclick="toggleAuthForm('register')">Mag-register dito</span>
        </div>
      </form>

      <!-- REGISTER FORM -->
      <form id="registerForm" style="display: none;">
        <h5 class="fw-bold mb-3 text-center" style="color: var(--pandayan-burgundy);">Gumawa ng Account</h5>

        <div class="mb-2">
          <label class="form-label small fw-bold">Pangalan ng Kapwa (Full Name)</label>
          <input type="text" id="regKapwaName" class="form-control" placeholder="Juan Dela Cruz" required>
        </div>

        <div class="mb-2">
          <label class="form-label small fw-bold">Username</label>
          <input type="text" id="regUsername" class="form-control" placeholder="Username" required>
        </div>

        <div class="mb-2">
          <label class="form-label small fw-bold">Password</label>
          <div class="input-group">
            <input type="password" id="regPassword" class="form-control" placeholder="Password" required>
            <span class="input-group-text bg-light" onclick="togglePasswordVisibility('regPassword', 'eyeIconReg')" title="Ipakita/Itago ang Password">
              <i class="fa-solid fa-eye text-secondary" id="eyeIconReg"></i>
            </span>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold">Email Address (Optional)</label>
          <input type="email" id="regEmail" class="form-control" placeholder="kapwa@pandayan.com.ph">
        </div>

        <button type="submit" class="btn btn-pandayan mt-2 shadow-sm">REGISTER ACCOUNT</button>

        <div class="text-center mt-3 small">
          May account na? <span class="toggle-link" onclick="toggleAuthForm('login')">Mag-log in dito</span>
        </div>
      </form>

    </div>
  </div>

  <script>
    // LATEST DEPLOYED API URL
    const API_URL = "https://script.google.com/macros/s/AKfycbyDAsLnXQDkxVFrEKOrxxVJgf2Hoh5CzZhhKNENGcZGisu2-Mcj6WxnpFs8RwfZEa3Uhg/exec";

    function showSpinner(msg = "Loading...") {
      document.getElementById("loadingText").innerText = msg;
      document.getElementById("loadingOverlay").style.display = "flex";
    }
    function hideSpinner() {
      document.getElementById("loadingOverlay").style.display = "none";
    }

    function toggleAuthForm(formType) {
      if (formType === 'register') {
        document.getElementById("loginForm").style.display = "none";
        document.getElementById("registerForm").style.display = "block";
      } else {
        document.getElementById("registerForm").style.display = "none";
        document.getElementById("loginForm").style.display = "block";
      }
    }

    // EYE ICON TOGGLE FOR PASSWORD VISIBILITY
    function togglePasswordVisibility(inputId, eyeIconId) {
      const inputEl = document.getElementById(inputId);
      const eyeEl = document.getElementById(eyeIconId);
      if (inputEl.type === "password") {
        inputEl.type = "text";
        eyeEl.classList.remove("fa-eye");
        eyeEl.classList.add("fa-eye-slash");
      } else {
        inputEl.type = "password";
        eyeEl.classList.remove("fa-eye-slash");
        eyeEl.classList.add("fa-eye");
      }
    }

    // LOGIN PROCESS
    document.getElementById("loginForm").onsubmit = function(e) {
      e.preventDefault();
      showSpinner("Chine-check ang iyong account...");

      const payload = {
        username: document.getElementById("loginUsername").value.trim(),
        password: document.getElementById("loginPassword").value.trim()
      };

      const remember = document.getElementById("rememberMe").checked;

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "login", payload: payload })
      })
      .then(r => r.json())
      .then(res => {
        hideSpinner();
        if (res.status === "success") {
          // SAVE SESSION BASED ON STAY LOGGED IN
          if (remember) {
            localStorage.setItem("pandayan_user_session", JSON.stringify(res.user));
            sessionStorage.removeItem("pandayan_user_session");
          } else {
            sessionStorage.setItem("pandayan_user_session", JSON.stringify(res.user));
            localStorage.removeItem("pandayan_user_session");
          }
          
          Swal.fire({
            title: "Mabuhay!",
            text: `Welcome back, ${res.user.kapwaName}!`,
            icon: "success",
            confirmButtonColor: "#800020",
            timer: 1500,
            showConfirmButton: false
          }).then(() => {
            window.location.href = "dashboard.html";
          });
        } else {
          Swal.fire("Login Failed", res.message, "error");
        }
      })
      .catch(err => {
        hideSpinner();
        Swal.fire("Error", "Server Error: " + err.toString(), "error");
      });
    };

    // REGISTER PROCESS
    document.getElementById("registerForm").onsubmit = function(e) {
      e.preventDefault();
      showSpinner("Isina-save ang iyong account registration...");

      const payload = {
        kapwaName: document.getElementById("regKapwaName").value.trim(),
        username: document.getElementById("regUsername").value.trim(),
        password: document.getElementById("regPassword").value.trim(),
        email: document.getElementById("regEmail").value.trim()
      };

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "register", payload: payload })
      })
      .then(r => r.json())
      .then(res => {
        hideSpinner();
        if (res.status === "success") {
          Swal.fire({
            title: "Rehistro Matagumpay!",
            text: res.message,
            icon: "success",
            confirmButtonColor: "#800020"
          }).then(() => {
            document.getElementById("registerForm").reset();
            toggleAuthForm('login');
          });
        } else {
          Swal.fire("Registration Error", res.message, "error");
        }
      })
      .catch(err => {
        hideSpinner();
        Swal.fire("Error", "Server Error: " + err.toString(), "error");
      });
    };

    // AUTO-CHECK IF ALREADY LOGGED IN
    window.onload = function() {
      const session = localStorage.getItem("pandayan_user_session") || sessionStorage.getItem("pandayan_user_session");
      if (session) {
        window.location.href = "dashboard.html";
      }
    };
  </script>
</body>
</html>
